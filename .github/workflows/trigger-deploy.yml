name: Production deploy

# Production deploy is handled by a polling timer on the VPS — it checks
# this repo's origin/main every 60s and rebuilds the soap-ai.com container
# whenever there's a new commit. So this workflow doesn't actually deploy
# anything; it just confirms to the pusher that the push was received and
# tells them when to expect it live.
#
# (No PAT or secret needed. The earlier dispatch-based wiring was replaced
# because GitHub Actions can't reliably SSH into the VPS — Hostinger blocks
# the rotating runner IPs at network edge.)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm push will deploy via VPS polling
        run: |
          echo "Production polls origin/main every 60 seconds."
          echo "This commit (${GITHUB_SHA::7}) will be live at https://soap-ai.com within ~90 seconds."
          echo ""
          echo "Watch deploy progress on the VPS:"
          echo "  journalctl -u myapp-deploy.service -f"
