name: Trigger production deploy

# Triggers the deploy.yml workflow in andreaskra/landing-page via
# workflow_dispatch (NOT repository_dispatch). This matters for security:
# repository_dispatch needs a PAT with `Contents: write` on the main repo,
# which would also grant `git clone` / `git push` if the token leaked.
# workflow_dispatch only needs `Actions: write`, which lets the holder
# trigger workflows but cannot read or modify repo contents. So even if
# this repo's DEPLOY_TRIGGER_TOKEN secret were exfiltrated by a
# malicious workflow change, the attacker cannot read the main repo.
#
# Required secret in this repo's settings:
#   DEPLOY_TRIGGER_TOKEN  — fine-grained PAT scoped to andreaskra/landing-page
#                           with ONLY: Actions (Read and write)
#                           (Metadata: Read is added automatically)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # also allow manual re-deploys from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger landing-page deploy workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          token: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
          repo: andreaskra/landing-page
          workflow: deploy.yml
          ref: main
