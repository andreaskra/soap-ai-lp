server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/track {
        proxy_pass https://fhvuacfchffrjyclbdos.supabase.co/functions/v1/track;
        proxy_ssl_server_name on;
        proxy_set_header Host fhvuacfchffrjyclbdos.supabase.co;
        proxy_set_header Content-Type application/json;
    }

    location /api/analytics {
        proxy_pass https://fhvuacfchffrjyclbdos.supabase.co/functions/v1/analytics;
        proxy_ssl_server_name on;
        proxy_set_header Host fhvuacfchffrjyclbdos.supabase.co;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
